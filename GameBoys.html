<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>CousinCrew - GameBoys</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        .header {
            padding: 12px;
            background-color: rgb(0, 0, 255);
            color: #ffffff;
            font-weight: bold;
            text-align: center;
        }

        video,
        iframe {
            border: 5px solid #e7e5e5;
            border-radius: 4px;
            background-color: black;
        }

        .video {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
        }

        /* SEARCH BAR WITH YOUR EXACT ICON */
        .search-container {
            padding: 10px;
            text-align: center;
        }

        .search-box {
            position: relative;
            display: inline-block;
            width: 90%;
            max-width: 600px;
        }

        #searchInput {
            width: 100%;
            padding: 14px 50px 14px 16px;
            font-size: 1.1rem;
            border: 2px solid #007bff;
            border-radius: 10px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            cursor: pointer;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 10px 10px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            display: none;
        }

        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            text-align: left;
        }

        .suggestion-item:hover {
            background-color: #e3f2fd;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

    <div class="header" style="display:flex;align-items:center;justify-content:center;gap:10px;">
        <img src="cc-logo.png" alt="CousinCrew Logo" style="height:40px;width:40px;object-fit:contain;border-radius:6px;">
        <span>GameBoys</span>
    </div>

    <!-- YOUR ORIGINAL LAYOUT — NOW 100% FIXED AND EXACT -->
    <div class="layout">
        <div class="sidebar">
            <a href="index.html" class="btn btn-outline-primary">Home</a>
            <a href="GameBoys.html" class="btn btn-outline-primary">GameBoys</a>
            <a href="Cousins-sites.html" class="btn btn-outline-primary">Our Sites</a>
            <a href="Games.html" class="btn btn-outline-primary">Games</a>
            <a href="about.html" class="btn btn-outline-primary">About</a>
        </div>
        <div class="content" style="text-align: center;">
            <!-- SEARCH BAR (perfect with your icon) -->
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search videos by title..." autocomplete="off">
                    <div class="search-icon" id="searchBtn"></div>
                    <div id="suggestions" class="suggestions"></div>
                </div>
            </div>
            <div class="video">
                <video width="100%" height="400" controls>
                    <source src="GameBoys Trailer.mov" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <h4>GameBoys Trailer</h4>
            </div>
            <hr>
            <br>
            <div id="videoContainer">
                <div class="video">
                    <iframe src="https://drive.google.com/file/d/1e-jRTgiYtOaa49kT3qMdjVTezRHpuHHp/preview" width="320"
                        height="240"></iframe>
                    <h4>Oh no i'm going to teliport!!!</h4>
                </div>
                <div class="video">
                    <iframe src="https://drive.google.com/file/d/158cKq9_KYRSftW2amQZFeBxieCAcK1za/preview" width="320"
                        height="240"></iframe>
                    <h4>GoJitsu Surgery</h4>
                </div>
                <div class="video">
                    <iframe src="https://drive.google.com/file/d/1c_WSYqeNgRK4sXKx2DSQsv7krUKaeKRx/preview" width="320"
                        height="240"></iframe>
                    <h4>Dumb Tornadoes.</h4>
                </div>
            </div>
            <p style="background-color: #ffff00; text-align: center;">every thing we make is kid friendly. <br> that
                is why we are not on youtube</p>
        </div>
    </div>

    <!-- PERFECT WORKING SEARCH SCRIPT -->
    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const suggestionsBox = document.getElementById('suggestions');

        const allVideoDivs = [
            document.querySelector('.content > .video'),
            ...document.querySelectorAll('#videoContainer .video')
        ];

        const videoData = allVideoDivs.map(div => ({
            element: div,
            title: div.querySelector('h4').textContent.trim(),
            lower: div.querySelector('h4').textContent.trim().toLowerCase()
        }));

        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            videoData.forEach(item => {
                item.element.style.display = item.lower.includes(query) ? '' : 'none';
            });
        }

        function showSuggestions(matches) {
            suggestionsBox.innerHTML = '';
            if (!searchInput.value || matches.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }
            matches.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = item.title;
                div.onclick = () => {
                    searchInput.value = item.title;
                    performSearch();
                    suggestionsBox.style.display = 'none';
                };
                suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = 'block';
        }

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim();
            performSearch();

            if (!query) {
                videoData.forEach(v => v.element.style.display = '');
                suggestionsBox.style.display = 'none';
                return;
            }

            const matches = videoData
                .filter(v => v.lower.includes(query.toLowerCase()))
                .slice(0, 6);

            showSuggestions(matches);
        });

        searchBtn.addEventListener('click', () => {
            performSearch();
            suggestionsBox.style.display = 'none';
        });

        document.addEventListener('click', e => {
            if (!document.querySelector('.search-box').contains(e.target)) {
                suggestionsBox.style.display = 'none';
            }
        });
    </script>
</body>

</html>
