<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SUPER SEAGULLS</title>
<style>
body { margin:0; background:#87CEEB; overflow:hidden; font-family:Arial; }
canvas { display:block; }
#ui { position:absolute; top:10px; left:10px; color:#0ff; font: bold 32px Arial; text-shadow:0 0 10px #0ff; z-index:10; }
#gunui { position:absolute; top:50px; left:10px; color:#ff0; font: bold 32px Arial; text-shadow:0 0 10px #ff0; z-index:10; }
#start, #gameover {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; cursor:pointer; z-index:20; user-select:none;
}
#start { font:bold 72px Arial; color:#fff; text-shadow:0 0 20px #000; display:block; }
#gameover { font:bold 90px Arial; color:#f00; text-shadow:0 0 20px red; display:none; }

#instructions { position:absolute; bottom:10px; left:10px; color:#fff; font:18px Arial; text-shadow:2px 4px #000; }
</style>
</head>
<body>
<div id="ui">SCORE: <span id="score">0</span></div>
<div id="gunui">GUN LV: <span id="gunlvl">0</span></div>
<div id="start">SUPER SEAGULLS<br><span style="font-size:50px">Click to play</span></div>
<div id="gameover">
    YOU WERE SEAGULLED!<br><br>
    <span style="font-size:50px">Final Score: <span id="finalscore">0</span></span><br><br>
    <span style="font-size:45px">Gun Lv: <span id="finalgun">0</span></span><br><br>
    <span style="font-size:40px">Click to try again</span>
</div>
<div id="instructions">WASD/Arrows = Fly  Mouse = Aim & Shoot  4 Guns = GOD MODE</div>
<canvas id="c"></canvas>

<script>
// =============== SUPER SEAGULLS - FIXED & FINAL ===============
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;

let score = 0, upgradeLevel = 0, gameOver = false, started = false;
let boss = null, nextBossScore = 800;
const player = { x: canvas.width/2, y: canvas.height/2, radius: 20, speed: 7.2, wingAngle: 0, wingSpeed: 0.5 };
const bullets = [], enemies = [], powerups = [], bossBullets = [];
let mouse = { x: canvas.width/2, y: canvas.height/2 };

let spawnTimer = 0, powerupTimer = 0;
const scoreUI = document.getElementById('score');
const gunUI = document.getElementById('gunlvl');
const startScreen = document.getElementById('start');
const gameOverScreen = document.getElementById('gameover');

function drawSeagull(x, y, radius, isPlayer = false, isRed = false) {
    ctx.save();
    const body = isRed ? '#ff2222' : '#f5f5dc';
    const wing = isRed ? '#dd1111' : '#e8e8d0';
    const beak = isRed ? '#aa0000' : '#ffdbac';
    const flap = Math.sin(player.wingAngle + (isRed ? Date.now()*0.018 : 0)) * 0.45;
    
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = wing;
    // Left wing
    ctx.beginPath(); ctx.moveTo(x - radius*0.7, y);
    ctx.quadraticCurveTo(x - radius*(1.6 + flap), y - radius*0.6, x - radius*1.1, y + radius*0.3);
    ctx.quadraticCurveTo(x - radius*0.7, y + radius*0.2, x - radius*0.4, y); ctx.closePath(); ctx.fill();
    // Right wing
    ctx.beginPath(); ctx.moveTo(x + radius*0.7, y);
    ctx.quadraticCurveTo(x + radius*(1.6 + flap), y - radius*0.6, x + radius*1.1, y + radius*0.3);
    ctx.quadraticCurveTo(x + radius*0.7, y + radius*0.2, x + radius*0.4, y); ctx.closePath(); ctx.fill();
    
    ctx.fillStyle = beak;
    ctx.beginPath(); ctx.moveTo(x + radius*0.7, y - radius*0.15);
    ctx.lineTo(x + radius*1.3, y); ctx.lineTo(x + radius*0.7, y + radius*0.15); ctx.closePath(); ctx.fill();
    
    ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(x + radius*0.4, y - radius*0.3, radius*0.18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(x + radius*0.42, y - radius*0.34, radius*0.08, 0, Math.PI*2); ctx.fill();
    
    if (isPlayer && upgradeLevel >= 4) {
        ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 50;
        ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2); ctx.stroke();
    }
    ctx.restore();
}

function drawBaldEagle(x, y, r) {
    ctx.save(); ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.ellipse(x, y, r*0.9, r*1.1, 0, 0, Math.PI*2); ctx.fill();
    const flap = Math.sin(Date.now() * 0.012) * 0.6;
    ctx.fillStyle = '#A0522D';
    // Wings
    ctx.beginPath(); ctx.moveTo(x - r*0.8, y);
    ctx.quadraticCurveTo(x - r*2.4, y - r*0.8 + flap, x - r*1.8, y + r*0.6);
    ctx.quadraticCurveTo(x - r*1.0, y + r*0.4, x - r*0.6, y); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + r*0.8, y);
    ctx.quadraticCurveTo(x + r*2.4, y - r*0.8 + flap, x + r*1.8, y + r*0.6);
    ctx.quadraticCurveTo(x + r*1.0, y + r*0.4, x + r*0.6, y); ctx.closePath(); ctx.fill();
    
    ctx.fillStyle = '#F5F5F5'; ctx.beginPath(); ctx.arc(x, y - r*0.4, r*0.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.moveTo(x + r*0.4, y - r*0.5); ctx.lineTo(x + r*1.4, y - r*0.4);
    ctx.lineTo(x + r*1.0, y - r*0.2); ctx.lineTo(x + r*0.5, y - r*0.4); ctx.closePath(); ctx.fill();

    // HP bar
    const hp = boss.health / boss.maxHealth;
    const w = 180;
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(x - w/2, y - r - 40, w, 22);
    ctx.fillStyle = hp > 0.5 ? '#0f0' : hp > 0.25 ? '#ff0' : '#f00';
    ctx.fillRect(x - w/2, y - r - 40, w * hp, 22);
    ctx.strokeStyle = 'white'; ctx.lineWidth = 4; ctx.strokeRect(x - w/2, y - r - 40, w, 22);
    ctx.restore();
}

function shoot() {
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    const spread = upgradeLevel * 0.32;
    const shots = 1 + upgradeLevel;
    const speed = 14 + upgradeLevel * 2.5;
    for (let i = 0; i < shots; i++) {
        const a = angle + (i - (shots-1)/2) * (spread / Math.max(1, shots-1));
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(a)*speed, vy: Math.sin(a)*speed, life: 90, size: 5 + upgradeLevel });
    }
}

function spawnRedSeagull() {
    const side = Math.random() < 0.5 ? -60 : canvas.width + 60;
    const y = 100 + Math.random() * (canvas.height - 200);
    enemies.push({ x: side, y, radius: 21, speed: 1.6 + score * 0.00035 });
}

function spawnBoss() {
    const side = Math.random() < 0.5 ? -150 : canvas.width + 150;
    boss = {
        x: side, y: canvas.height/2, radius: 68, speed: 1.9,
        health: 70 + upgradeLevel * 15, maxHealth: 70 + upgradeLevel * 15,
        shootTimer: 0
    };
}

function spawnPowerup() {
    const x = 100 + Math.random() * (canvas.width - 200);
    const y = 100 + Math.random() * (canvas.height - 200);
    powerups.push({ x, y, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, radius: 16 });
}

function resetGame() {
    score = 0; upgradeLevel = 0; boss = null; nextBossScore = 800;
    scoreUI.textContent = '0'; gunUI.textContent = '0';
    bullets.length = enemies.length = powerups.length = bossBullets.length = 0;
    player.x = canvas.width/2; player.y = canvas.height/2; player.wingAngle = 0;
}

function startGame() {
    started = true;
    gameOver = false;
    startScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';
    resetGame();
}

// Click handler - FIXED
canvas.addEventListener('click', (e) => {
    if (e.target !== canvas) return; // Ignore clicks on UI overlays
    if (!started) startGame();
    else if (gameOver) startGame(); // This was the bug! Now restarts properly
    else shoot();
});

// Also allow clicking directly on the game over screen (extra safety)
gameOverScreen.addEventListener('click', () => {
    if (gameOver) startGame();
});

addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function loop() {
    if (!started || gameOver) {
        requestAnimationFrame(loop);
        return;
    }

    ctx.fillStyle = 'rgba(135,206,250,0.15)';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Player movement
    const moving = keys.w||keys.s||keys.a||keys.d||keys.arrowup||keys.arrowdown||keys.arrowleft||keys.arrowright;
    player.wingAngle += moving ? player.wingSpeed : player.wingSpeed * 0.4;
    if (keys.w || keys.arrowup) player.y -= player.speed;
    if (keys.s || keys.arrowdown) player.y += player.speed;
    if (keys.a || keys.arrowleft) player.x -= player.speed;
    if (keys.d || keys.arrowright) player.x += player.speed;
    player.x = Math.max(30, Math.min(canvas.width-30, player.x));
    player.y = Math.max(30, Math.min(canvas.height-30, player.y));

    // Auto-shoot at level 4
    if (upgradeLevel >= 4 && Math.random() < 0.45) shoot();

    // Boss spawn
    if (upgradeLevel >= 3 && score >= nextBossScore && !boss) {
        spawnBoss();
        nextBossScore += 1200;
    }

    // Enemy & powerup spawn
    if (++spawnTimer > 40) { spawnTimer = 0; spawnRedSeagull();
        if (score > 400 && Math.random() < 0.5) spawnRedSeagull();
    }
    if (++powerupTimer > 400 && powerups.length < 3) { powerupTimer = 0; spawnPowerup(); }

    // Update bullets
    for (let i = bullets.length-1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx; b.y += b.vy; b.life--;
        ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI*2); ctx.fill();
        if (b.life <= 0 || b.x < -100 || b.x > canvas.width+100 || b.y < -100 || b.y > canvas.height+100)
            bullets.splice(i,1);
    }

    // Enemies
    for (let i = enemies.length-1; i >= 0; i--) {
        const e = enemies[i];
        const dx = player.x - e.x, dy = player.y - e.y;
        const dist = Math.hypot(dx, dy) || 1;
        e.x += dx/dist * e.speed; e.y += dy/dist * e.speed;
        drawSeagull(e.x, e.y, e.radius, false, true);

        if (dist < player.radius + e.radius + 8) gameOver = true;

        for (let j = bullets.length-1; j >= 0; j--) {
            if (Math.hypot(bullets[j].x - e.x, bullets[j].y - e.y) < bullets[j].size + e.radius) {
                bullets.splice(j,1); enemies.splice(i,1); score += 10; scoreUI.textContent = score; break;
            }
        }
    }

    // Boss
    if (boss) {
        const dx = player.x - boss.x, dy = player.y - boss.y;
        const dist = Math.hypot(dx, dy) || 1;
        boss.x += dx/dist * boss.speed; boss.y += dy/dist * boss.speed;
        boss.shootTimer++;
        if (boss.shootTimer > 70) {
            boss.shootTimer = 0;
            const a = Math.atan2(player.y - boss.y, player.x - boss.x);
            bossBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a)*10, vy: Math.sin(a)*10 });
        }
        drawBaldEagle(boss.x, boss.y, boss.radius);
        if (dist < player.radius + boss.radius) gameOver = true;

        for (let j = bullets.length-1; j >= 0; j--) {
            if (Math.hypot(bullets[j].x - boss.x, bullets[j].y - boss.y) < bullets[j].size + boss.radius) {
                bullets.splice(j,1); boss.health--;
                if (boss.health <= 0) {
                    score += 500; scoreUI.textContent = score; boss = null;
                    for (let k = 0; k < 5; k++) spawnPowerup();
                }
            }
        }
    }

    // Boss bullets
    for (let i = bossBullets.length-1; i >= 0; i--) {
        const b = bossBullets[i];
        b.x += b.vx; b.y += b.vy;
        ctx.fillStyle = '#ff4400'; ctx.beginPath(); ctx.arc(b.x, b.y, 16, 0, Math.PI*2); ctx.fill();
        if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius + 16) gameOver = true;
        if (b.x < -100 || b.x > canvas.width+100 || b.y < -100 || b.y > canvas.height+100) bossBullets.splice(i,1);
    }

    // Powerups
    for (let i = powerups.length-1; i >= 0; i--) {
        const p = powerups[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < p.radius || p.x > canvas.width-p.radius) p.vx *= -1;
        if (p.y < p.radius || p.y > canvas.height-p.radius) p.vy *= -1;
        ctx.save(); ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 30;
        ctx.translate(p.x, p.y); ctx.fillStyle = '#666'; ctx.fillRect(-14,-8,28,16);
        ctx.fillStyle = '#444'; ctx.fillRect(12,-6,20,12); ctx.fillStyle = '#ffaa00'; ctx.fillRect(30,-3,10,6);
        ctx.restore();
        if (Math.hypot(p.x - player.x, p.y - player.y) < player.radius + p.radius) {
            upgradeLevel = Math.min(4, upgradeLevel + 1);
            gunUI.textContent = upgradeLevel;
            powerups.splice(i,1);
        }
    }

    // Draw player + aim line
    drawSeagull(player.x, player.y, player.radius, true);
    ctx.strokeStyle = upgradeLevel >= 4 ? 'rgba(255,255,0,0.8)' : 'rgba(255,255,255,0.4)';
    ctx.lineWidth = upgradeLevel >= 4 ? 7 : 3;
    ctx.setLineDash(upgradeLevel >= 4 ? [15,10] : []);
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
    ctx.setLineDash([]);

    // Game over screen
    if (gameOver) {
        document.getElementById('finalscore').textContent = score;
        document.getElementById('finalgun').textContent = upgradeLevel;
        gameOverScreen.style.display = 'block';
    }

    requestAnimationFrame(loop);
}

addEventListener('resize', () => {
    canvas.width = innerWidth; canvas.height = innerHeight;
    player.x = canvas.width/2; player.y = canvas.height/2;
});

loop();
</script>
</body>
</html>
