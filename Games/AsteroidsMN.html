<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALAXY MOTHER NATURE FIGHT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0a0f1f 0%, #000000 100%);
            color: #fff;
            font-family: 'Press Start 2P', system-ui;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 2.95rem;
            margin: 15px 0 10px 0;
            text-shadow: 0 0 40px #00ffcc, 0 0 90px #0088ff;
            color: #00ffdd;
            letter-spacing: 8px;
        }

        canvas {
            border: 10px solid #00ffcc;
            border-radius: 20px;
            box-shadow: 0 0 70px #00ffcc, 0 0 150px #006699, inset 0 0 100px rgba(0, 255, 200, 0.3);
            background: #000d22;
        }

        .instructions {
            margin-top: 20px;
            font-size: 1rem;
            line-height: 1.7;
            max-width: 780px;
            text-align: center;
            color: #bbffdd;
        }
    </style>
</head>

<body>
    <h1>GALAXY MOTHER NATURE FIGHT</h1>
    <canvas id="canvas" width="900" height="620"></canvas>

    <div class="instructions">
        WASD / Arrows — Fly your Arwing<br>
        MOUSE — Aim • CLICK — Fire lasers<br>
        Collect orbs! <span style="color:#ff4488">❤️ HEALS</span> spawn most often<br>
        <strong>Unlimited power-ups</strong> — timers stack when you pick up duplicates!
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;

        // Player
        let player = {
            x: WIDTH / 2,
            y: HEIGHT / 2,
            speed: 8.8,
            health: 100,
            shield: 0,
            radius: 26,
            angle: 0,
            vx: 0,
            vy: 0
        };

        let asteroids = [];
        let projectiles = [];
        let powerups = [];
        let stars = [];
        let particles = [];

        let score = 0;
        let gameOver = false;
        let gameStarted = false;

        let activeEffects = {}; // key → endTime
        const POWERUP_DURATION = 9500; // 9.5 seconds base

        // 30 NEW POWER-UPS + old ones = 44 total
        const powerupTypes = [
            // Original ones
            { key: 'rapid', name: 'RAPID FIRE', color: '#ffdd00', symbol: '⚡' },
            { key: 'spread', name: 'SPREAD SHOT', color: '#ff00dd', symbol: '↔' },
            { key: 'shield', name: 'ENERGY SHIELD', color: '#00ddff', symbol: '🛡️' },
            { key: 'boost', name: 'THRUST BOOST', color: '#00ff88', symbol: '🚀' },
            { key: 'laser', name: 'BEAM LASER', color: '#88ffff', symbol: '⟡' },
            { key: 'pierce', name: 'PIERCING SHOT', color: '#ffaa00', symbol: '→' },
            { key: 'mega', name: 'MEGA BLAST', color: '#ff4488', symbol: '☄' },

            // 30 NEW POWER-UPS
            { key: 'double', name: 'DOUBLE LASER', color: '#ffff00', symbol: '2' },
            { key: 'homing', name: 'HOMING MISSILE', color: '#ff8800', symbol: '🔒' },
            { key: 'vampire', name: 'VAMPIRE SHOT', color: '#aa00ff', symbol: '🩸' },
            { key: 'ice', name: 'ICE STORM', color: '#00ffff', symbol: '❄' },
            { key: 'fire', name: 'FIRE STORM', color: '#ff4400', symbol: '🔥' },
            { key: 'light', name: 'LIGHTNING', color: '#ffff88', symbol: '⚡' },
            { key: 'gravity', name: 'GRAVITY WELL', color: '#8844ff', symbol: '⟐' },
            { key: 'time', name: 'TIME SLOW', color: '#aaffff', symbol: '⏳' },
            { key: 'explode', name: 'EXPLOSIVE', color: '#ff6600', symbol: '💥' },
            { key: 'chain', name: 'CHAIN LIGHTNING', color: '#88ff88', symbol: '⚡' },
            { key: 'sniper', name: 'SNIPER BEAM', color: '#ffffff', symbol: '⟶' },
            { key: 'wave', name: 'WAVE SHOT', color: '#00ffcc', symbol: '～' },
            { key: 'orb', name: 'ORBITAL DRONE', color: '#ff99ff', symbol: '◉' },
            { key: 'reflect', name: 'REFLECT SHIELD', color: '#88aaff', symbol: '⟲' },
            { key: 'speed', name: 'SPEED BURST', color: '#ffdd88', symbol: '🏃' },
            { key: 'healover', name: 'REGEN AURA', color: '#ff4488', symbol: '♻' },
            { key: 'armor', name: 'SUPER ARMOR', color: '#cccccc', symbol: '⛨' },
            { key: 'crit', name: 'CRITICAL HIT', color: '#ff2222', symbol: '💥' },
            { key: 'multihit', name: 'MULTI HIT', color: '#ffff44', symbol: '×' },
            { key: 'bounce', name: 'BOUNCING SHOT', color: '#88ff88', symbol: '↩' },
            { key: 'poison', name: 'TOXIC CLOUD', color: '#88ff00', symbol: '☣' },
            { key: 'blackhole', name: 'BLACK HOLE', color: '#440088', symbol: '●' },
            { key: 'laserwall', name: 'LASER WALL', color: '#00aaff', symbol: '▮' },
            { key: 'drone', name: 'ATTACK DRONE', color: '#ffaa00', symbol: '◉' },
            { key: 'emp', name: 'EMP BLAST', color: '#aaaaaa', symbol: '⚡' },
            { key: 'nova', name: 'SUPERNOVA', color: '#ff00aa', symbol: '🌟' },
            { key: 'clone', name: 'CLONE SHIP', color: '#88ffff', symbol: '👥' },
            { key: 'magnet', name: 'POWER MAGNET', color: '#ff88ff', symbol: '⟐' },
            { key: 'overheat', name: 'OVERHEAT', color: '#ff6600', symbol: '🔥' },
            { key: 'ghost', name: 'GHOST MODE', color: '#cccccc', symbol: '👻' },
            { key: 'ult', name: 'ULTIMATE BLAST', color: '#ff00ff', symbol: '☄' }
        ];

        let keys = {};
        let mouse = { x: WIDTH / 2, y: HEIGHT / 2 };
        let lastShotTime = 0;
        let lastSpawnTime = 0;
        let spawnRate = 650;
        let difficultyTimer = Date.now();

        function generateStars() {
            stars = [];
            for (let i = 0; i < 500; i++) {
                stars.push({
                    x: Math.random() * WIDTH,
                    y: Math.random() * HEIGHT,
                    size: Math.random() * 3.8 + 0.7,
                    speed: Math.random() * 1.2 + 0.4
                });
            }
        }

        function createParticle(x, y, color, size = 3) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 24,
                color,
                size: Math.random() * size + 2
            });
        }

        function spawnAsteroid() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            switch (side) {
                case 0: x = Math.random() * WIDTH; y = -80; break;
                case 1: x = WIDTH + 80; y = Math.random() * HEIGHT; break;
                case 2: x = Math.random() * WIDTH; y = HEIGHT + 80; break;
                case 3: x = -80; y = Math.random() * HEIGHT; break;
            }

            const size = 36 + Math.random() * 26;
            asteroids.push({
                x, y, size,
                radius: size * 0.76,
                speed: 2.3 + Math.random() * 1.2,
                vx: 0, vy: 0,
                homingEnd: Date.now() + 850 + Math.random() * 750,
                wobble: Math.random() * Math.PI * 2
            });
        }

        function spawnPowerup(x, y) {
            // Heals spawn most often
            let type;
            if (Math.random() < 0.38) {
                type = { key: 'health', name: 'VITAL REPAIR', color: '#ff4488', symbol: '❤️' };
            } else {
                type = powerupTypes[Math.floor(Math.random() * powerupTypes.length)];
            }

            powerups.push({
                x: x + (Math.random() * 40 - 20),
                y: y + (Math.random() * 40 - 20),
                type: type.key,
                color: type.color,
                symbol: type.symbol,
                name: type.name,
                life: 900,
                vx: (Math.random() - 0.5) * 1.4,
                vy: (Math.random() - 0.5) * 1.4
            });
        }

        function shoot() {
            const now = Date.now();
            const isRapid = activeEffects['rapid'] && activeEffects['rapid'] > now;
            if (now - lastShotTime < (isRapid ? 45 : 115)) return;
            lastShotTime = now;

            const dx = mouse.x - player.x;
            const dy = mouse.y - player.y;
            const dist = Math.hypot(dx, dy) || 1;
            const speed = 21;
            let baseVX = (dx / dist) * speed;
            let baseVY = (dy / dist) * speed;

            const hasSpread = activeEffects['spread'] && activeEffects['spread'] > now;
            const hasPierce = activeEffects['pierce'] && activeEffects['pierce'] > now;
            const hasMega = activeEffects['mega'] && activeEffects['mega'] > now;

            if (hasSpread) {
                for (let i = -2; i <= 2; i++) {
                    const vx = baseVX + i * 0.25 * baseVY;
                    const vy = baseVY - i * 0.25 * baseVX;
                    projectiles.push({ x: player.x, y: player.y, vx, vy, life: 70, pierce: hasPierce });
                }
            } else if (hasMega) {
                projectiles.push({ x: player.x, y: player.y, vx: baseVX * 1.5, vy: baseVY * 1.5, life: 95, pierce: true, mega: true });
            } else {
                projectiles.push({ x: player.x, y: player.y, vx: baseVX, vy: baseVY, life: 78, pierce: hasPierce });
            }

            createParticle(player.x - Math.cos(player.angle) * 22, player.y - Math.sin(player.angle) * 22, '#ffffff', 7);
        }

        function resetGame() {
            player.x = WIDTH / 2;
            player.y = HEIGHT / 2;
            player.health = 100;
            player.shield = 0;
            score = 0;
            asteroids = [];
            projectiles = [];
            powerups = [];
            activeEffects = {};
            particles = [];
            gameOver = false;
            spawnRate = 650;
            lastSpawnTime = Date.now();
            difficultyTimer = Date.now();

            for (let i = 0; i < 8; i++) spawnAsteroid();
        }

        function update() {
            if (!gameStarted || gameOver) return;

            // Movement
            player.vx = 0; player.vy = 0;
            if (keys['a'] || keys['arrowleft']) player.vx -= 1;
            if (keys['d'] || keys['arrowright']) player.vx += 1;
            if (keys['w'] || keys['arrowup']) player.vy -= 1;
            if (keys['s'] || keys['arrowdown']) player.vy += 1;

            if (player.vx || player.vy) {
                const len = Math.hypot(player.vx, player.vy);
                const boost = activeEffects['boost'] && activeEffects['boost'] > Date.now() ? 1.8 : 1;
                player.x += (player.vx / len) * player.speed * boost;
                player.y += (player.vy / len) * player.speed * boost;
                if (Math.random() < 0.65) createParticle(player.x - Math.cos(player.angle) * 26, player.y - Math.sin(player.angle) * 26, '#ffaa44', 4);
            }

            player.x = Math.max(35, Math.min(WIDTH - 35, player.x));
            player.y = Math.max(35, Math.min(HEIGHT - 35, player.y));
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            // Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                if (p.life <= 0 || p.x < -150 || p.x > WIDTH + 150 || p.y < -150 || p.y > HEIGHT + 150) projectiles.splice(i, 1);
            }

            // Asteroids
            const now = Date.now();
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                if (now < a.homingEnd) {
                    const dx = player.x - a.x;
                    const dy = player.y - a.y;
                    const d = Math.hypot(dx, dy) || 1;
                    a.vx = (dx / d) * a.speed * 0.95;
                    a.vy = (dy / d) * a.speed * 0.95;
                }
                a.x += a.vx; a.y += a.vy; a.wobble += 0.17;

                if (a.x < -200 || a.x > WIDTH + 200 || a.y < -200 || a.y > HEIGHT + 200) {
                    asteroids.splice(i, 1); continue;
                }

                if (Math.hypot(player.x - a.x, player.y - a.y) < player.radius + a.radius) {
                    if (player.shield > 0) player.shield--;
                    else player.health -= 24;
                    createParticle(a.x, a.y, '#ff5555', 12);
                    asteroids.splice(i, 1);
                    if (player.health <= 0) gameOver = true;
                }
            }

            // Collisions
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const a = asteroids[j];
                    if (Math.hypot(p.x - a.x, p.y - a.y) < 20 + a.radius) {
                        score += 42;
                        for (let k = 0; k < 18; k++) createParticle(a.x, a.y, '#ffcc66', 6);
                        asteroids.splice(j, 1);
                        if (!p.pierce) projectiles.splice(i, 1);

                        if (Math.random() < 0.85) spawnPowerup(a.x, a.y);
                        if (Math.random() < 0.5) spawnPowerup(a.x, a.y);
                        break;
                    }
                }
            }

            // Power-up collection
            for (let i = powerups.length - 1; i >= 0; i--) {
                const pu = powerups[i];
                pu.x += pu.vx * 0.96;
                pu.y += pu.vy * 0.96;
                pu.vx *= 0.97;
                pu.vy *= 0.97;
                pu.life--;

                if (Math.hypot(player.x - pu.x, player.y - pu.y) < 55) {
                    const nowTime = Date.now();

                    if (pu.type === 'health') {
                        player.health = Math.min(100, player.health + 45);
                    } else if (pu.type === 'shield') {
                        player.shield = Math.min(5, player.shield + 1);
                    } else {
                        // Timer stacking!
                        if (activeEffects[pu.type]) {
                            activeEffects[pu.type] = Math.max(activeEffects[pu.type], nowTime + POWERUP_DURATION);
                        } else {
                            activeEffects[pu.type] = nowTime + POWERUP_DURATION;
                        }
                    }
                    powerups.splice(i, 1);
                    continue;
                }
                if (pu.life <= 0) powerups.splice(i, 1);
            }

            // Expire old effects
            const currentTime = Date.now();
            for (let k in activeEffects) {
                if (activeEffects[k] < currentTime) delete activeEffects[k];
            }

            // Difficulty
            if (currentTime - difficultyTimer > 13500) {
                spawnRate = Math.max(240, spawnRate - 42);
                difficultyTimer = currentTime;
            }

            if (currentTime - lastSpawnTime > spawnRate) {
                spawnAsteroid();
                if (Math.random() < 0.6) setTimeout(spawnAsteroid, 50);
                lastSpawnTime = currentTime;
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                p.vx *= 0.92; p.vy *= 0.92;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawArwing() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.shadowBlur = 28;
            ctx.shadowColor = '#00ffcc';
            ctx.fillStyle = '#00aaff';
            ctx.beginPath();
            ctx.moveTo(28, 0);
            ctx.lineTo(-22, -18);
            ctx.lineTo(-16, 0);
            ctx.lineTo(-22, 18);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#0066aa';
            ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(-32, -28); ctx.lineTo(-24, -12); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(-32, 28); ctx.lineTo(-24, 12); ctx.closePath(); ctx.fill();

            ctx.shadowBlur = 18; ctx.shadowColor = '#ffffcc';
            ctx.fillStyle = '#ccffff';
            ctx.beginPath(); ctx.ellipse(8, 0, 12, 10, 0, 0, Math.PI * 2); ctx.fill();

            if (player.vx || player.vy) {
                ctx.shadowBlur = 45; ctx.shadowColor = '#ff7700';
                ctx.fillStyle = '#ffdd66';
                ctx.fillRect(-30, -8, 16, 16);
            }
            ctx.restore();
        }

        function drawAsteroid(a) {
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.wobble * 0.3);
            ctx.shadowBlur = 12; ctx.shadowColor = '#555555';
            ctx.fillStyle = '#bbbbbb';
            ctx.beginPath(); ctx.arc(0, 0, a.size, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#666666';
            ctx.beginPath(); ctx.arc(-a.size * 0.4, -a.size * 0.35, a.size * 0.35, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(a.size * 0.45, a.size * 0.3, a.size * 0.28, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = '#0a0f22';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            const t = Date.now() / 160;
            for (let s of stars) {
                const tw = Math.sin(t * s.speed + s.x) * 0.5 + 0.6;
                ctx.globalAlpha = tw;
                ctx.fillStyle = '#eeffff';
                ctx.fillRect(s.x, s.y, s.size, s.size);
            }
            ctx.globalAlpha = 1;

            ctx.shadowBlur = 28; ctx.shadowColor = '#aaffff';
            for (let p of projectiles) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(Math.atan2(p.vy, p.vx));
                ctx.fillStyle = p.mega ? '#ff88ff' : '#ccffff';
                ctx.fillRect(-6, -22, 12, 48);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-3, -30, 6, 20);
                ctx.restore();
            }
            ctx.shadowBlur = 0;

            for (let a of asteroids) drawAsteroid(a);
            if (!gameOver) drawArwing();

            // Power-ups
            for (let pu of powerups) {
                const pulse = 26 + Math.sin(Date.now() / 85) * 8;
                ctx.shadowBlur = 38;
                ctx.shadowColor = pu.color;
                ctx.fillStyle = pu.color;
                ctx.beginPath(); ctx.arc(pu.x, pu.y, pulse, 0, Math.PI * 2); ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#111133';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(pu.symbol, pu.x, pu.y);
            }

            for (let p of particles) {
                ctx.globalAlpha = p.life / 24;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;

            // HUD
            ctx.fillStyle = '#112233';
            ctx.fillRect(28, 22, 280, 32);
            const hp = Math.max(0, player.health / 100);
            ctx.fillStyle = hp > 0.35 ? '#00ffbb' : '#ff5555';
            ctx.fillRect(28, 22, 280 * hp, 32);
            if (player.shield > 0) {
                ctx.fillStyle = '#00ccff';
                ctx.fillRect(28, 22, 280 * (player.shield / 5), 10);
            }
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.strokeRect(28, 22, 280, 32);

            ctx.fillStyle = '#ffff00';
            ctx.font = 'bold 28px "Press Start 2P"';
            ctx.textAlign = 'right';
            ctx.fillText('SCORE ' + String(Math.floor(score)).padStart(7, '0'), WIDTH - 35, 55);

            // Active power-ups (unlimited)
            if (Object.keys(activeEffects).length > 0) {
                let idx = 0;
                for (let k in activeEffects) {
                    const left = Math.ceil((activeEffects[k] - Date.now()) / 1000);
                    if (left > 0) {
                        const info = powerupTypes.find(p => p.key === k) || { name: k.toUpperCase(), color: '#ffffff' };
                        ctx.fillStyle = info.color;
                        ctx.font = '16px "Press Start 2P"';
                        ctx.textAlign = 'right';
                        ctx.fillText(info.name + ' ' + left + 's', WIDTH - 35, 95 + idx * 24);
                        idx++;
                    }
                }
            }

            // Start / Game Over
            if (!gameStarted) {
                ctx.fillStyle = 'rgba(8,12,45,0.95)';
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                ctx.shadowBlur = 65; ctx.shadowColor = '#00ffcc';
                ctx.fillStyle = '#00ffdd';
                ctx.font = 'bold 70px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText('GALAXY', WIDTH / 2, 170);
                ctx.fillText('MOTHER', WIDTH / 2, 250);
                ctx.fillText('NATURE', WIDTH / 2, 330);
                ctx.fillText('FIGHT', WIDTH / 2, 410);

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffff66';
                ctx.font = 'bold 36px "Press Start 2P"';
                ctx.fillText('CLICK TO START', WIDTH / 2, 530);
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(50,0,0,0.94)';
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                ctx.shadowBlur = 55; ctx.shadowColor = '#ff4444';
                ctx.fillStyle = '#ff2222';
                ctx.font = 'bold 72px "Press Start 2P"';
                ctx.fillText('MISSION FAILED', WIDTH / 2, HEIGHT / 2 - 90);

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffff44';
                ctx.font = '32px "Press Start 2P"';
                ctx.fillText('FINAL SCORE ' + String(Math.floor(score)).padStart(7, '0'), WIDTH / 2, HEIGHT / 2 + 20);

                ctx.fillStyle = '#00ffff';
                ctx.font = '24px "Press Start 2P"';
                ctx.fillText('CLICK TO PLAY AGAIN', WIDTH / 2, HEIGHT / 2 + 110);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', () => {
            if (!gameStarted || gameOver) {
                gameStarted = true;
                resetGame();
            } else {
                shoot();
            }
        });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.touches[0].clientX - rect.left;
            mouse.y = e.touches[0].clientY - rect.top;
            if (!gameStarted || gameOver) {
                gameStarted = true;
                resetGame();
            } else {
                shoot();
            }
        });

        generateStars();
        gameLoop();
    </script>
</body>

</html>
