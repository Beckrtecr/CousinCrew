<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>CousinCrew</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
    .header {
        padding: 10px 16px;
        background-color: rgb(0, 0, 255);
        color: #ffffff;
        font-weight: bold;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .header img.site-logo {
        height: 40px;
        width: 40px;
        object-fit: contain;
        border-radius: 6px;
    }
    .header span {
        font-size: 1.4rem;
        letter-spacing: 1px;
    }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <div class="header">
        <img src="cousin crew logo.png" alt="CousinCrew Logo" class="site-logo">
        <span>CousinCrew</span>
    </div>
    <div class="layout">
        <div class="sidebar">
            <a href="index.html" class="btn btn-outline-primary">Home</a>
            <a href="GameBoys.html" class="btn btn-outline-primary">GameBoys</a>
            <a href="Cousins-sites.html" class="btn btn-outline-primary">Our Sites</a>
            <a href="Games.html" class="btn btn-outline-primary">Games</a>
            <a href="about.html" class="btn btn-outline-primary">About</a>
        </div>
        <div class="content">

            <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel"
                style="width: 60%; margin: auto;">
                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="10000">
                        <img src="cousin crew logo.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item" data-bs-interval="2000">
                        <img src="gameboys-high-resolution-logo.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="Screenshot 2025-09-22 at 8.13.48 AM.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="qrcode_beckrtecr.github.io.png" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
            <p style="background-color: #ffff00; text-align: center;">every thing we make is kid friendly. <br> that is
                why we are not on youtube</p>
        </div>
    </div>
</body>

</html>
